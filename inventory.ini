# 主機清單（Inventory）：告訴 Ansible 有哪些機器、怎麼連、分成哪些群組
# 三台都在本機，只是 SSH port 不同
#
# inventory 是基礎：group_vars/ 和 host_vars/ 的檔名必須對應這裡的名稱才會生效
#   [web] 群組  → group_vars/web.yml
#   web1 主機   → host_vars/web1.yml
# 如果把 web.yml 改名成 webs.yml，Ansible 就找不到對應的群組，變數也就不會套用
# （不會報錯，只是靜靜地被忽略，所以要特別注意拼字）

[web]
web1 ansible_host=127.0.0.1 ansible_port=2221
web2 ansible_host=127.0.0.1 ansible_port=2222

[db]
db1 ansible_host=127.0.0.1 ansible_port=2223

# 套用到所有主機的共用變數
[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/ansible_lab
